<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Codriver + Audio test</title>
<style>
  body { font: 13px system-ui, sans-serif; background: #15171c; color: #dde; margin: 16px; max-width: 1000px; }
  fieldset { border: 1px solid #445; margin: 10px 0; padding: 8px 12px; }
  label { display: inline-block; margin: 3px 12px 3px 0; }
  input[type=range] { width: 200px; vertical-align: middle; }
  pre { background: #0c0d10; padding: 8px; overflow: auto; max-height: 260px; }
  button { margin: 2px; padding: 4px 10px; }
  #info { color: #8f8; margin: 6px 0; }
</style>
</head>
<body>
<h2>Codriver + AudioEngine test</h2>
<button id="start">Start audio (user gesture)</button>

<fieldset><legend>Codriver</legend>
  <label>Verbosity <select id="verb"><option>all</option><option>key</option></select></label>
  <label>Mode <select id="mode"><option>voice</option><option>text</option></select></label>
  <label>Voice <select id="voice"></select></label><br>
  <label>Speed (m/s) <input id="speed" type="range" min="5" max="75" value="30"></label>
  <label>Position <input id="dist" type="range" min="0" max="3000" value="20" step="1"></label><br>
  <button id="play">Drive</button><button id="restart">Restart</button><button id="repeat">Repeat last</button>
  <div id="info"></div>
  <b>Calls</b><pre id="log"></pre>
  <b>Generated notes</b><pre id="notes"></pre>
</fieldset>

<fieldset><legend>AudioEngine</legend>
  <label>RPM <input id="rpm" type="range" min="900" max="7800" value="3000"></label>
  <label>Throttle <input id="thr" type="range" min="0" max="1" step="0.01" value="0.5"></label>
  <label><input id="autogear" type="checkbox" checked> auto gear from rpm</label><br>
  <label>Slip <input id="slip" type="range" min="0" max="3" step="0.05" value="0"></label>
  <label>Water <input id="water" type="range" min="0" max="1" step="0.05" value="0"></label>
  <label>Surface <select id="surf"><option>tarmac</option><option>wet</option><option>gravel</option><option>dirt</option><option>sand</option><option>snow</option><option>ice</option><option>mud</option><option>grass</option><option>ash</option></select></label>
  <label><input id="airborne" type="checkbox"> airborne (untick = landing thump)</label>
  <label><input id="pause" type="checkbox"> paused</label><br>
  <label>Master <input id="master" type="range" min="0" max="1" step="0.01" value="0.8"></label>
  <label>Engine <input id="engv" type="range" min="0" max="1" step="0.01" value="0.7"></label>
  <label>FX <input id="fxv" type="range" min="0" max="1" step="0.01" value="0.8"></label><br>
  <label>Impact <input id="impStr" type="range" min="1" max="20" value="8"></label><button id="impact">Impact</button>
  <button data-beep="countdown">countdown</button><button data-beep="go">go</button>
  <button data-beep="split">split</button><button data-beep="finish">finish</button><button data-beep="ui">ui</button>
</fieldset>
<script type="module" src="./codriver-test.js"></script>
</body>
</html>
